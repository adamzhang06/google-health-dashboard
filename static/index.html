<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Health Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Google Health Dashboard</h1>
      <p class="sub">Sleep data pulled from the Google Health API.</p>
    </header>

    <section class="card">
      <h2>Connection</h2>
      <p id="status" class="status">Checking&hellip;</p>
      <a class="btn" href="/login">Connect Google Account</a>
    </section>

    <section class="card">
      <h2>Sleep</h2>
      <div id="sleep" class="empty">No data yet.</div>
    </section>
    
    <footer>
      <a href="/docs">API docs</a>
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
